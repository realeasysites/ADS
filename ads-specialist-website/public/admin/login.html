<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | Abatement and Demolition Specialist LLC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: var(--black); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 44px 38px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow);
  }
  .login-card img { height: 40px; margin: 0 auto 24px; }
  .login-card h1 { font-size: 1.3rem; text-align: center; }
</style>
</head>
<body>
  <div class="login-card">
    <img src="../images/logo.png" alt="Abatement and Demolition Specialist LLC">
    <h1>Admin Login</h1>
    <form id="login-form">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
      <p id="login-status" style="margin-top:14px; color: var(--red); font-size:0.9rem;"></p>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('login-status');
      statusEl.textContent = '';
      try {
        const res = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const result = await res.json();
        if (res.ok && result.ok) {
          window.location.href = '/admin';
        } else {
          statusEl.textContent = result.error || 'Login failed.';
        }
      } catch (err) {
        statusEl.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
